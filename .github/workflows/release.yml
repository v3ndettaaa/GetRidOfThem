name: Build and Release Extension

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Extension ZIP
        run: |
          zip -r GetRidOfThem.zip content icons popup manifest.json README.md LICENSE

      - name: Move 'nightly' Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f nightly
          git push origin -f nightly

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Development Build (Auto-updated)"
          body: "This is the auto-generated ZIP file for the latest version of the extension on the main branch. It updates automatically on every push."
          files: GetRidOfThem.zip
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

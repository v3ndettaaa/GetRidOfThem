name: Automated Extension Release & Zip Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Zip & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Extension Zip Package
        run: |
          mkdir -p dist
          zip -r dist/GetRidOfThem.zip manifest.json content/ popup/ icons/ README.md LICENSE

      - name: Create or Update GitHub Release (Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GetRidOfThem.zip
          title: Release ${{ github.ref_name }}
          body: |
            ## 🎒 GetRidOfThem Browser Extension Package
            
            ### 🚀 Installation Guide:
            - **Chrome / Brave / Edge:** Download `GetRidOfThem.zip`, unzip it, go to `chrome://extensions`, enable Developer Mode, and click **Load unpacked**.
            - **Zen Browser / Firefox:** Download `GetRidOfThem.zip`, go to `about:config`, set `xpinstall.signatures.required` to `false`, then go to `about:addons` -> **Install Add-on From File...** and select `GetRidOfThem.zip`.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Release (Main Branch Push)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release (Auto-built)
          files: dist/GetRidOfThem.zip
          body: |
            ## 🎒 GetRidOfThem - Latest Build
            Automatically updated from latest commit on `main` branch.
            
            ### 📥 Downloads:
            - **`GetRidOfThem.zip`**: Download and install in Chrome, Firefox, or Zen Browser.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
